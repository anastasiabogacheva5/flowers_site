                <ol>

                    <li><b>Удалите лишние листья:</b> Те листья, которые окажутся под водой, должны быть удалены, иначе вода быстро протухнет.</li>

                    .forms-page p { margin: 10px 0; }
                    .forms-page label.main { display: inline-block; width: 190px; }
                </style>

                <div class="forms-page">
                    <center><h2>Формы</h2></center>

                    <form action="https://www.bing.com/search" method="get">
                        <fieldset>
                            <legend>Контактные данные</legend>

                    <form action="https://www.bing.com/search" method="get">

                            <p><label class="main" for="delivery_date">Дата доставки:</label>

        function showPage(pageName, linkElement) {
            document.getElementById('content').innerHTML = pages[pageName];
            if (currentMarker && currentMarker.parentNode) {
                currentMarker.parentNode.removeChild(currentMarker);
            }
            currentMarker = document.createElement('b');
            currentMarker.innerHTML = ' (Вы здесь)';
            linkElement.parentNode.appendChild(currentMarker);

            if (pageName === 'forms') {
                document.getElementById('message_date').value = new Date().toISOString().slice(0, 10);
            }

            window.scrollTo(0, 0);
        }

        function showPageAndScroll(pageName, anchorId, linkElement) {
            showPage(pageName, linkElement);
            setTimeout(function() {
                var anchor = document.getElementById(anchorId);
                if (anchor) {
                    anchor.scrollIntoView({ behavior: 'smooth' });
                }
            }, 50);
        }

        window.onload = function() {
            var firstLink = document.querySelector('ul li a');
            showPage('home', firstLink);
        };
